name: CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  macos-build:
    name: macOS Swift Build
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Swift version
        run: swift --version

      - name: Validate reference analysis tool
        run: |
          python3 -m py_compile Tools/reference_video_analysis.py Tools/reference_preview_server.py Tools/validate_reference_audio.py
          node --check Tools/reference_preview/app.js

      - name: Validate polished reference audio
        run: |
          python3 Tools/validate_reference_audio.py \
            Sources/SquishMac/Resources/Sounds/white-putty-video-5-knead \
            Sources/SquishMac/Resources/Sounds/white-putty-video-5-stretch \
            --expected-count 20 \
            --peak-ceiling-db -10
          python3 Tools/validate_reference_audio.py \
            Sources/SquishMac/Resources/Sounds/aerated-clear-video-6-knead \
            Sources/SquishMac/Resources/Sounds/aerated-clear-video-6-stretch \
            --expected-count 42 \
            --peak-ceiling-db -10
          python3 Tools/validate_reference_audio.py \
            Sources/SquishMac/Resources/Sounds/dense-white-clay-video-7-knead \
            Sources/SquishMac/Resources/Sounds/dense-white-clay-video-7-stretch \
            --expected-count 29 \
            --peak-ceiling-db -10
          python3 Tools/validate_reference_audio.py \
            Sources/SquishMac/Resources/Sounds/pink-gummy-jelly-video-8-knead \
            Sources/SquishMac/Resources/Sounds/pink-gummy-jelly-video-8-stretch \
            --expected-count 30 \
            --peak-ceiling-db -10
          python3 Tools/validate_reference_audio.py \
            Sources/SquishMac/Resources/Sounds/white-poke-putty-video-9-body \
            Sources/SquishMac/Resources/Sounds/white-poke-putty-video-9-texture \
            Sources/SquishMac/Resources/Sounds/orange-glossy-video-10-pop \
            Sources/SquishMac/Resources/Sounds/orange-glossy-video-10-snap \
            Sources/SquishMac/Resources/Sounds/green-micro-bead-video-11-body \
            Sources/SquishMac/Resources/Sounds/green-micro-bead-video-11-pop \
            --expected-count 61 \
            --peak-ceiling-db -10

      - name: Build debug executable
        run: swift build -v

      - name: Run tests
        run: swift test -v

      - name: Build app bundle
        run: bash Scripts/package-app.sh

      - name: Verify app bundle
        run: |
          test -x .build/SquishMac.app/Contents/MacOS/SquishMac
          test -f .build/SquishMac.app/Contents/Info.plist
          test -d .build/SquishMac.app/Contents/Resources/SquishMac_SquishMac.bundle
          plutil -lint .build/SquishMac.app/Contents/Info.plist
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' .build/SquishMac.app/Contents/Info.plist)" = "com.gyeongbin.squishmac"

      - name: Zip app bundle
        run: ditto -c -k --sequesterRsrc --keepParent .build/SquishMac.app .build/SquishMac.app.zip

      - name: Upload app bundle
        uses: actions/upload-artifact@v7
        with:
          name: SquishMac
          path: .build/SquishMac.app.zip
          if-no-files-found: error
